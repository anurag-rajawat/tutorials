apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: demo
spec:
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: anuragrajawat/ingestion-service:v0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: demo
spec:
  selector:
    app: ingestion-service
  ports:
    - port: 8888
      targetPort: 8888
